name: Deployment 2
on: push
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v3
            - name: Install dependencies
              run: npm ci
            - name: Run lint test
              run: npm run lint  
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v3
            - name: Install dependencies
              run: npm ci              
            - name: Run Test Code
              run: npm run test
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v3
            - name: Install dependencies
              run: npm ci
            - name: Deploy code
              run: echo "deploying shreyas's code"