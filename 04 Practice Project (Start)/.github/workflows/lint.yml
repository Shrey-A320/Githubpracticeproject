name: Build Lint Project
on: push
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6
            - name: Install NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Run lint test
              run: run npm test    
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Build Project
              run: npm run build
            - name: Deploy
              run: echo "Deploy shreyas's project"          